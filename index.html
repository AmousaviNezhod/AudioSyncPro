<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Audio Sync Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v3h3"/>
                        <path d="M21 18v3h-3"/>
                        <circle cx="12" cy="10" r="3"/>
                        <path d="M12 2v2"/>
                        <path d="M12 16v2"/>
                        <path d="M5.6 5.6l1.4 1.4"/>
                        <path d="M17 7l1.4-1.4"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <div class="brand-name">Audio Sync Pro</div>
                    <div class="brand-sub">سینک خودکار صدا</div>
                </div>
            </div>
            <div class="status-chip" id="statusChip">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusLabel">آماده</span>
            </div>
        </header>

        <main class="app-body">
            <!-- Sync Settings -->
            <section class="panel-card" style="--stagger:1">
                <div class="card-header">
                    <div class="card-icon sync-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v4"/>
                            <path d="M12 18v4"/>
                            <path d="M4.93 4.93l2.83 2.83"/>
                            <path d="M16.24 16.24l2.83 2.83"/>
                            <path d="M2 12h4"/>
                            <path d="M18 12h4"/>
                            <path d="M4.93 19.07l2.83-2.83"/>
                            <path d="M16.24 7.76l2.83-2.83"/>
                        </svg>
                    </div>
                    <div class="card-title">تنظیمات سینک</div>
                </div>

                <div class="input-group">
                    <label for="preset">حالت دقت</label>
                    <select id="preset" class="select-input">
                        <option value="fast">سریع — پیش‌نمایش</option>
                        <option value="balanced" selected>متعادل — سرعت و دقت</option>
                        <option value="accurate">دقیق — بیشترین دقت</option>
                        <option value="custom">سفارشی — تنظیم دستی</option>
                    </select>
                    <div class="input-hint" id="presetHint">۱۶kHz · ۳۰s · آستانه ۰.۴۵</div>
                </div>

                <div id="customSettings" class="custom-settings hidden">
                    <div class="input-row">
                        <div class="input-group half">
                            <label for="sampleRate">نرخ نمونه</label>
                            <select id="sampleRate" class="select-input">
                                <option value="8000">۸ kHz</option>
                                <option value="16000" selected>۱۶ kHz</option>
                                <option value="22050">۲۲.۰۵ kHz</option>
                            </select>
                        </div>
                        <div class="input-group half">
                            <label for="sampleSeconds">مدت نمونه (ثانیه)</label>
                            <input id="sampleSeconds" class="text-input" type="number" min="5" max="300" value="40" dir="ltr">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group half">
                            <label for="maxOffset">حداکثر آفست (ثانیه)</label>
                            <input id="maxOffset" class="text-input" type="number" step="0.5" value="30.0" dir="ltr">
                        </div>
                        <div class="input-group half">
                            <label for="matchThreshold">آستانه شباهت</label>
                            <input id="matchThreshold" class="text-input" type="number" min="0.1" max="1" step="0.05" value="0.40" dir="ltr">
                        </div>
                    </div>
                </div>

                <label class="option-item">
                    <input id="placeOnTracks" type="checkbox" checked>
                    <span class="checkmark"></span>
                    <span class="option-label">کلیپ‌های هم‌گروه را روی ترک‌های جداگانه بچین</span>
                </label>

                <button id="syncBtn" class="btn btn-primary btn-block">
                    <span class="btn-icon">▶</span>
                    <span>سینک</span>
                </button>
            </section>

            <!-- Normalize Settings -->
            <section class="panel-card" style="--stagger:2">
                <div class="card-header">
                    <div class="card-icon norm-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12h20"/>
                            <path d="M4 8v8"/>
                            <path d="M8 6v12"/>
                            <path d="M12 4v16"/>
                            <path d="M16 8v8"/>
                            <path d="M20 12v0"/>
                        </svg>
                    </div>
                    <div class="card-title">تنظیمات نرمالایز</div>
                </div>

                <div class="input-row">
                    <div class="input-group half">
                        <label for="targetPeak">هدف اوج صدا (dBFS)</label>
                        <input id="targetPeak" class="text-input" type="number" step="0.5" value="-3.0" dir="ltr">
                    </div>
                    <div class="input-group half">
                        <label for="normMode">نوع نرمالایز</label>
                        <select id="normMode" class="select-input">
                            <option value="peak" selected>Peak</option>
                        </select>
                    </div>
                </div>
                <div class="input-hint">مقدار منفی‌تر (مثلاً -۳ dBFS) فضای بیشتری برای هد‌روم می‌گذارد.</div>

                <button id="normalizeBtn" class="btn btn-secondary btn-block">
                    <span class="btn-icon">∿</span>
                    <span>نرمالایز</span>
                </button>
            </section>

            <!-- Progress -->
            <section class="panel-card progress-card" id="progressPanel" style="display: none; --stagger:3">
                <div class="progress-header">
                    <span id="progressLabel">آماده</span>
                    <span id="progressPercent">۰٪</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </section>

            <!-- Log -->
            <section class="panel-card log-card" style="--stagger:4">
                <div class="card-title log-title">رویدادها</div>
                <div id="logOutput" class="log-output"></div>
            </section>
        </main>

        <footer class="app-footer">
            <div id="footerStatus" class="footer-status">آماده</div>
        </footer>
    </div>

    <!-- Adobe libs -->
    <script src="libs/CSInterface.js"></script>
    <script src="libs/Vulcan.js"></script>

    <!-- Core modules -->
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
