<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Audio Sync Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v3h3"/><path d="M21 18v3h-3"/><circle cx="12" cy="10" r="3"/><path d="M12 2v2"/><path d="M12 16v2"/><path d="M5.6 5.6l1.4 1.4"/><path d="M17 7l1.4-1.4"/></svg>
                </div>
                <div class="brand-text">
                    <div class="brand-name">Audio Sync Pro</div>
                    <div class="brand-sub">سینک خودکار صدا</div>
                </div>
            </div>
            <div class="status-dot" id="statusDot" title="وضعیت موتور"></div>
        </header>

        <main class="app-body">
            <section class="panel-section" style="--stagger:1">
                <div class="section-title">حالت دقت</div>
                <div class="input-group">
                    <label for="preset">یکی از حالت‌های زیر را انتخاب کنید</label>
                    <select id="preset" class="select-input">
                        <option value="fast">سریع — برای پیش‌نمایش</option>
                        <option value="balanced" selected>متعادل — بهترین تعادل سرعت و دقت</option>
                        <option value="accurate">دقیق — بیشترین دقت</option>
                        <option value="custom">سفارشی — تنظیم دستی</option>
                    </select>
                    <div class="input-hint" id="presetHint">نرخ نمونه ۱۶kHz، ۳۰ ثانیه، آستانه ۰.۴۵</div>
                </div>

                <div id="customSettings" class="custom-settings hidden">
                    <div class="input-row">
                        <div class="input-group half">
                            <label for="sampleRate">نرخ نمونه</label>
                            <select id="sampleRate" class="select-input">
                                <option value="8000">۸ kHz</option>
                                <option value="16000" selected>۱۶ kHz</option>
                                <option value="22050">۲۲.۰۵ kHz</option>
                            </select>
                        </div>
                        <div class="input-group half">
                            <label for="sampleSeconds">مدت نمونه (ثانیه)</label>
                            <input id="sampleSeconds" class="text-input" type="number" min="5" max="120" value="30">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group half">
                            <label for="maxOffset">حداکثر آفست (ثانیه)</label>
                            <input id="maxOffset" class="text-input" type="number" step="0.5" value="10.0">
                        </div>
                        <div class="input-group half">
                            <label for="matchThreshold">آستانه شباهت (۰ تا ۱)</label>
                            <input id="matchThreshold" class="text-input" type="number" min="0.1" max="1" step="0.05" value="0.45">
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel-section" style="--stagger:2">
                <div class="section-title">گزینه‌ها</div>
                <div class="option-list">
                    <label class="option-item">
                        <input id="placeOnTracks" type="checkbox" checked>
                        <span class="checkmark"></span>
                        <span class="option-label">گروه‌های سینک را روی ترک‌های جداگانه بچین</span>
                    </label>
                    <label class="option-item">
                        <input id="normalizeAudio" type="checkbox" checked>
                        <span class="checkmark"></span>
                        <span class="option-label">نرمالایز خودکار صدا</span>
                    </label>
                </div>
                <div class="input-row">
                    <div class="input-group half">
                        <label for="targetPeak">هدف نرمالایز (dBFS)</label>
                        <input id="targetPeak" class="text-input" type="number" step="0.5" value="-1.0">
                    </div>
                </div>
            </section>

            <section class="panel-section actions" style="--stagger:3">
                <button id="analyzeBtn" class="btn btn-primary btn-block">
                    <span class="btn-icon">▶</span>
                    <span>سینک و نرمالایز</span>
                </button>
                <button id="normalizeOnlyBtn" class="btn btn-secondary btn-block">
                    <span class="btn-icon">∿</span>
                    <span>فقط نرمالایز</span>
                </button>
            </section>

            <section class="panel-section progress-panel" id="progressPanel" style="display: none; --stagger:4">
                <div class="progress-header">
                    <span id="progressLabel">آماده</span>
                    <span id="progressPercent">۰٪</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </section>

            <section class="panel-section log-panel" style="--stagger:5">
                <div class="section-title">رویدادها</div>
                <div id="logOutput" class="log-output"></div>
            </section>
        </main>

        <footer class="app-footer">
            <div id="status" class="status">آماده</div>
        </footer>
    </div>

    <!-- Adobe libs -->
    <script src="libs/CSInterface.js"></script>
    <script src="libs/Vulcan.js"></script>

    <!-- Core modules -->
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
